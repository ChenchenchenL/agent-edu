groups:
  - name: agent-edu-memory
    rules:
      - alert: MemoryCandidateBacklogHigh
        expr: sum(agent_edu_memory_candidate_backlog) > 100
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Long-term memory candidate backlog is high
          description: More than 100 long-term memory candidates have been waiting for governance for 30 minutes.

      - alert: MemoryMaterializationFailureRateHigh
        expr: |
          sum(rate(agent_edu_long_term_memory_materialization_total{status="failed"}[15m]))
            / clamp_min(sum(rate(agent_edu_long_term_memory_materialization_total[15m])), 1) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Long-term memory materialization failure rate is high
          description: More than 5% of long-term memory materialization attempts have failed for 15 minutes.

      - alert: MemoryMaintenanceSlow
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(agent_edu_memory_maintenance_job_duration_seconds_bucket[15m])) by (le)
          ) > 30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Long-term memory maintenance p95 is slow
          description: Long-term memory maintenance job p95 duration has been above 30 seconds for 15 minutes.

      - alert: MemoryOpenConflictsGrowing
        expr: sum(rate(agent_edu_memory_conflict_events_total{event="created"}[30m])) > 0.1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Long-term memory conflicts are growing quickly
          description: New open memory conflicts are being created faster than expected for 30 minutes.
